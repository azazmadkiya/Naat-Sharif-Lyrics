name: Build Debug APK and AAB, Publish Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          
          JAVA_VERSION_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VERSION_STRING"
          
          if [[ "$JAVA_VERSION_STRING" =~ ^1\.([0-9]+) ]]; then
            JAVA_MAJOR=${BASH_REMATCH[1]}
          elif [[ "$JAVA_VERSION_STRING" =~ ^([0-9]+) ]]; then
            JAVA_MAJOR=${BASH_REMATCH[1]}
          else
            echo "::error::Could not detect Java major version."
            exit 1
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version 17 or newer is required. Found Java $JAVA_MAJOR."
            exit 1
          fi
          echo "Java version check passed: Java $JAVA_MAJOR is >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists at $KEYSTORE_PATH"
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            
            if [ -f "$KEYSTORE_PATH" ]; then
              echo "Successfully generated debug keystore at $KEYSTORE_PATH"
            else
              echo "::error::Failed to generate debug keystore."
              exit 1
            fi
          fi

      - name: Build Debug APK and AAB
        run: |
          echo "Building Debug APK..."
          gradle :app:assembleDebug --stacktrace --no-daemon
          echo "Building Debug AAB..."
          gradle :app:bundleDebug --stacktrace --no-daemon

      - name: Verify APK and AAB
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          AAB_PATH="app/build/outputs/bundle/debug/app-debug.aab"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK file is empty: $APK_PATH"
            exit 1
          fi
          
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::Expected debug AAB not found at $AAB_PATH"
            exit 1
          fi
          if [ ! -s "$AAB_PATH" ]; then
            echo "::error::AAB file is empty: $AAB_PATH"
            exit 1
          fi
          
          echo "APK and AAB verification successful!"

      - name: Upload debug APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-artifacts
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Prepare release assets
        id: prepare-assets
        run: |
          mkdir -p release_assets
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          SOURCE_AAB="app/build/outputs/bundle/debug/app-debug.aab"
          
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          
          APK_ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          AAB_ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.aab"
          
          DEST_APK="release_assets/$APK_ASSET_NAME"
          DEST_AAB="release_assets/$AAB_ASSET_NAME"
          
          cp "$SOURCE_APK" "$DEST_APK"
          cp "$SOURCE_AAB" "$DEST_AAB"
          
          echo "apk_path=$DEST_APK" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_ASSET_NAME" >> $GITHUB_OUTPUT
          echo "aab_path=$DEST_AAB" >> $GITHUB_OUTPUT
          echo "aab_name=$AAB_ASSET_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK and AAB to GitHub Releases
        id: publish-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version
          
          APK_PATH="${{ steps.prepare-assets.outputs.apk_path }}"
          APK_NAME="${{ steps.prepare-assets.outputs.apk_name }}"
          AAB_PATH="${{ steps.prepare-assets.outputs.aab_path }}"
          AAB_NAME="${{ steps.prepare-assets.outputs.aab_name }}"
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug Build & App Bundle #${{ github.run_number }}"
          
          echo "Creating GitHub Release: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "$APK_PATH#$APK_NAME" \
            "$AAB_PATH#$AAB_NAME" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "Automatically generated Debug APK and AAB build.
- Run #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
- Source Commit: ${{ github.sha }}
- Contains both app-debug.apk and app-debug.aab."

      - name: Report download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          if [ "${{ steps.publish-release.outcome }}" == "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$RELEASE_TAG" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
            
            {
              echo "### 🚀 APK & AAB Published Successfully!"
              echo ""
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Direct Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Assets**: \`$RELEASE_TAG.apk\` and \`$RELEASE_TAG.aab\` are available under the release **Assets** section."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "Artifacts 'app-debug-artifacts' remain available in Actions."
            
            {
              echo "### ⚠️ Build Succeeded, Release Publishing Failed"
              echo "- APK and AAB were built successfully and uploaded as Actions artifacts."
              echo "- Please check repository permissions or download from Actions."
            } >> $GITHUB_STEP_SUMMARY
          fi
